<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Judging Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">JP</span>
        <span>
          <strong>Judging Platform</strong>
          <small>Learning library</small>
        </span>
      </a>
      <nav class="platform-tabs" aria-label="Platform sections">
        <a
          href="{{ url_for('index') }}"
          class="{% if request.url.path == '/' or request.url.path.startswith('/decisions') %}active{% endif %}"
        >
          Decisions
        </a>
        <a
          href="{{ url_for('casebook_index') }}"
          class="{% if request.url.path.startswith('/casebook') %}active{% endif %}"
        >
          Casebook
        </a>
        <a
          href="{{ url_for('appendix_n_simulator') }}"
          class="{% if request.url.path.startswith('/appendix-n') %}active{% endif %}"
        >
          Appendix N
        </a>
        <a
          href="{{ url_for('wording_index') }}"
          class="{% if request.url.path.startswith('/wording') %}active{% endif %}"
        >
          Wording
        </a>
      </nav>
      <div class="site-header-actions">
        {% block header_actions %}{% endblock %}
        {% if request.url.path == "/" or request.url.path.startswith("/decisions") %}
          <button
            type="button"
            class="review-marker-toggle"
            data-review-marker-toggle
            aria-pressed="false"
          >
            Hide Review Marks
          </button>
        {% endif %}
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    
    <script src="{{ url_for('static', path='app.js') }}"></script>
  </body>
</html>
