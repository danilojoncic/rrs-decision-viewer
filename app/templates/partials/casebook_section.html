{% for section in case.study_sections %}
  {% if section.items and section.key not in ["summary", "rules", "source"] %}
    <details class="decision-section casebook-section" data-section="{{ section.key }}">
      <summary>
        <span>{{ section.title }}</span>
        <small>{{ section.items|length }}</small>
      </summary>
      <ol>
        {% for item in section.items %}
          <li>{{ item }}</li>
        {% endfor %}
      </ol>
    </details>
  {% endif %}
{% endfor %}
